<!DOCTYPE html>
<html>
<head>
    <title>{{ topic.title }}</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 40px 20px; background-image: url('{{ url_for('static', filename='background.jpg') }}'); background-size: cover; background-position: center; background-attachment: fixed; color: white; }
        .container { max-width: 600px; margin: 0 auto; background: rgba(15, 10, 20, 0.85); padding: 30px; border-radius: 15px; border: 1px solid rgba(255, 105, 180, 0.3); box-shadow: 0 0 20px rgba(255, 105, 180, 0.2); }
        .explanation { background: rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 8px; line-height: 1.6; overflow-x: auto; }
        a { color: #ff69b4; text-decoration: none; font-weight: bold; }
        button { background-color: #ff69b4; color: white; border: none; padding: 12px 24px; border-radius: 5px; cursor: pointer; font-size: 1em; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #ff1493; }
        label { display: block; margin: 10px 0; cursor: pointer; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 5px; }
        label:hover { background: rgba(255,255,255,0.15); }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ topic.title }}</h1>
        
        <div class="explanation">
            {{ topic.explanation | safe }}
        </div>

        <br>
        
        {% if topic.next_topic %}
            <a href="/topic/{{ topic.next_topic }}"><button>Prosegui →</button></a>
        {% else %}
            <h2>Quiz</h2>
            <form action="/check" method="POST">
                <input type="hidden" name="topic_id" value="{{ topic_id }}">
                <p>{{ topic.question }}</p>
                {% for option in topic.options %}
                    <label>
                        <input type="radio" name="answer" value="{{ option }}" required>
                        {{ option }}
                    </label>
                {% endfor %}
                <br>
                <button type="submit">Controlla risposta</button>
            </form>
        {% endif %}

        <br><br>
        <p><a href="/">← Torna agli argomenti</a></p>
    </div>
</body>
</html>
