<!DOCTYPE html>
<html>
<head>
    <title>Login - Aiuto Fisica</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-image: url('{{ url_for('static', filename='background.jpg') }}'); background-size: cover; color: #3e2723; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: rgba(222, 184, 135, 0.6); padding: 40px; border-radius: 15px; text-align: center; border: 3px solid #5d4037; width: 300px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #5d4037; background: rgba(255,255,255,0.7); }
        button { background: #5d4037; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background: #3e2723; }
        a { color: #5d4037; text-decoration: none; display: block; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Accedi</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Nome utente" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit">Entra</button>
        </form>
        <a href="/register">Non hai un account? Registrati</a>
    </div>
</body>
</html>
